<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f9fd" />
    <meta name="robots" content="noindex" />
    <title>Technical interview — SuperhumanResources</title>
    <link rel="stylesheet" href="/static/context.css" />
    <style>
      /* The candidate's page: the studio's look, without the recruiter's workspace. */
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .interview-top {
        height: 72px;
        border-bottom: 1px solid var(--line);
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 42px;
      }
      .interview-main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        max-width: none;
        margin: 0;
      }
      .interview-card {
        width: min(100%, 520px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 36px 36px 30px;
        text-align: center;
      }
      .interview-card .eyebrow {
        justify-content: center;
      }
      .interview-card h1 {
        font-size: clamp(28px, 4vw, 36px);
        letter-spacing: -1.4px;
        margin: 16px 0 12px;
      }
      .interview-card > p {
        font-size: 12px;
        line-height: 1.8;
        color: #59708e;
        margin: 0 auto 26px;
        max-width: 380px;
      }
      .orb {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        border: 1px solid #c6dbfa;
        background: #edf4ff;
        color: var(--accent);
        display: grid;
        place-items: center;
        margin: 0 auto 24px;
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .orb svg {
        width: 40px;
        height: 40px;
      }
      .orb.live {
        background: var(--accent);
        color: #ffffff;
        border-color: var(--accent);
        animation: orb-pulse 2s infinite;
      }
      @keyframes orb-pulse {
        0% {
          box-shadow: 0 0 0 0 #0866ff55;
        }
        70% {
          box-shadow: 0 0 0 22px #0866ff00;
        }
        100% {
          box-shadow: 0 0 0 0 #0866ff00;
        }
      }
      #btn {
        width: 100%;
      }
      #btn > svg:first-child {
        margin-right: 0;
      }
      .interview-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 20px;
        margin-top: 18px;
        font-size: 11px;
        color: #567193;
      }
      .interview-status.error {
        color: #b23a33;
      }
      .interview-status.error .status-dot {
        background: #b23a33;
      }
      .interview-tips {
        display: flex;
        justify-content: center;
        gap: 18px;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        font-size: 10px;
        color: #6b7d97;
      }
      .interview-foot {
        text-align: center;
        font-size: 9px;
        letter-spacing: 1.5px;
        color: #8391a6;
        padding: 18px;
      }
      @media (prefers-reduced-motion: reduce) {
        .orb.live {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-mic" viewBox="0 0 24 24">
          <rect x="9" y="2" width="6" height="12" rx="3" />
          <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24">
          <path d="M4 12h16m-6-6 6 6-6 6" />
        </symbol>
      </defs>
    </svg>
    <header class="interview-top">
      <span class="brand"
        ><span class="brand-mark"><img src="/static/brand-reference.png" alt="" /></span
        ><span class="topbar-brand"><span class="brand-name">Superhuman</span> <span class="brand-descriptor">Resources</span></span></span
      >
      <span class="engine-label"><span class="status-dot"></span>Voice interview</span>
    </header>
    <main class="interview-main">
      <section class="interview-card" aria-live="polite">
        <div class="eyebrow"><span></span><span id="eyebrow-text" style="all: unset">TECHNICAL INTERVIEW</span></div>
        <h1 id="title">Technical interview</h1>
        <p id="intro">
          A short voice conversation with Ada, our AI interviewer. Three
          questions, fifteen minutes at most.
        </p>
        <div class="orb" id="orb" aria-hidden="true">
          <svg><use href="#i-mic" /></svg>
        </div>
        <button class="button primary" id="btn" type="button" disabled>
          <span id="btn-label">Start interview</span
          ><svg class="button-arrow"><use href="#i-arrow" /></svg>
        </button>
        <div class="interview-status" id="status" role="status">
          <span class="status-dot"></span><span id="status-text">Checking your link…</span>
        </div>
        <div class="interview-tips" id="tips">
          <span>Use a headset</span><span>Find a quiet place</span
          ><span>Speak naturally</span>
        </div>
      </section>
    </main>
    <footer class="interview-foot">SUPERHUMAN RESOURCES</footer>

    <script src="static/js/opus-encoder.js"></script>
    <script src="static/js/audio-processor.js"></script>
    <script src="static/js/synced-audio-player.js"></script>
    <script>
      const sessionId = new URLSearchParams(location.search).get('session') || 'demo';
      const btn = document.getElementById('btn');
      const btnLabel = document.getElementById('btn-label');
      const orb = document.getElementById('orb');
      const statusEl = document.getElementById('status');
      const statusText = document.getElementById('status-text');
      let ws = null, player = null, live = false, finished = false;

      function setStatus(text, isError = false) {
        statusText.textContent = text;
        statusEl.className = 'interview-status' + (isError ? ' error' : '');
      }

      // The interview is over for good: leave only the message. No microphone,
      // no button, nothing that looks like it could be started again.
      function showOver(firstName, message) {
        document.getElementById('eyebrow-text').textContent = 'INTERVIEW COMPLETE';
        document.getElementById('title').textContent = `Thank you, ${firstName}.`;
        document.getElementById('intro').textContent = message;
        document.getElementById('intro').style.marginBottom = '0';
        for (const id of ['orb', 'btn', 'status', 'tips']) document.getElementById(id).hidden = true;
      }

      // The only thing this page learns about the session: a first name and whether it can start.
      async function checkLink() {
        try {
          const response = await fetch(`/sessions/${encodeURIComponent(sessionId)}/public`);
          if (!response.ok) throw new Error('This interview link is not valid.');
          const info = await response.json();
          const title = document.getElementById('title');
          title.textContent = `Hi ${info.first_name}, ready when you are.`;
          if (info.state === 'done') {
            showOver(info.first_name, 'Your interview is complete. The team will be in touch.');
          } else if (info.state === 'closed') {
            showOver(info.first_name, 'This interview has ended and cannot be restarted. The team will be in touch.');
          } else if (info.state === 'not_ready') {
            title.textContent = `Hi ${info.first_name}, almost ready.`;
            setStatus('Your interview is still being prepared. Try again in a minute.');
          } else if (finished) {
            // A sample session with no single-use rule: keep the finished message as it is.
          } else {
            btn.disabled = false;
            setStatus(info.retake
              ? 'The interview ended before it began. You can start again, once.'
              : 'Press start and allow the microphone');
          }
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      function teardown() {
        live = false;
        if (player) { player.stop(); player = null; }
        ws = null;
        orb.classList.remove('live');
        btnLabel.textContent = 'Start interview';
        // Whether it can be started again is the server's call, not the page's:
        // it answers "ready" (the one retake), or that the interview is over.
        btn.disabled = true;
        checkLink();
      }

      async function start() {
        finished = false;
        player = new SyncedAudioPlayer({
          basePath: 'static/js',
          sampleRate: 24000,
          echoCancellation: true,
          onEncodedAudio: (data) => {
            if (live && ws && ws.readyState === WebSocket.OPEN) ws.send(data);
          },
          onEvent: (type, msg) => {
            if (type === 'interview_finished') {
              live = false;  // stop sending mic audio; let the goodbye play out
              const ENDINGS = {
                completed: 'Interview finished. Thank you, the team will be in touch.',
                time_limit: 'We have reached the time limit. Thank you, the team will be in touch.',
                stopped: 'Interview ended.',
              };
              // A finished interview cannot be taken again; one that was stopped early can.
              finished = msg.reason === 'completed' || msg.reason === 'time_limit';
              setStatus(ENDINGS[msg.reason] || 'Interview ended.');
            }
          },
          onError: (error) => setStatus(error.message, true),
        });

        try {
          await player.start();
        } catch (error) {
          setStatus('Microphone access denied', true);
          player = null;
          return;
        }

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/sessions/${sessionId}/interview`);
        ws.onopen = () => {
          ws.send(JSON.stringify({ type: 'start' }));
          live = true;
          orb.classList.add('live');
          btnLabel.textContent = 'End interview';
          setStatus('Interview in progress');
        };
        ws.onmessage = (event) => player && player.handleMessage(event.data);
        ws.onerror = () => setStatus('Connection error', true);
        ws.onclose = () => {
          if (!finished && !statusEl.classList.contains('error') && statusText.textContent === 'Interview in progress')
            setStatus('Disconnected');
          teardown();
        };
      }

      function stop() {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'stop' }));
        live = false;
        btn.disabled = true;
        setStatus('Ending…');
      }

      btn.addEventListener('click', () => (ws ? stop() : start()));
      checkLink();
    </script>
  </body>
</html>
